<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#38a8ed">
  <title>BanglaGram 🇧🇩</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h2>🇧🇩 BanglaGram</h2>
  <button id="logoutBtn" hidden>Logout</button>
</header>

<main>
  <section id="authSection" class="auth-card">
    <h2>Welcome to BanglaGram</h2>
    <p>Connect with Bangladesh 🇧🇩</p>

    <div id="signupFields">
      <input id="name" placeholder="Your name">
    </div>

    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">

    <button id="signupBtn">Create Account</button>
    <button id="loginBtn" class="secondary">Login</button>
    <button id="resetBtn" class="link-btn">Forgot Password?</button>
    <p id="authMessage"></p>
  </section>

  <section id="appSection" hidden>
    <div class="welcome-card">
      <h2 id="welcomeName">Welcome!</h2>
      <p>Share your moments with Bangladesh.</p>
    </div>

    <section class="create-post">
      <h3>Create a post</h3>
      <textarea id="postText" placeholder="What's on your mind?"></textarea>
      <input id="imageUrl" placeholder="Image URL (optional)">
      <button id="postBtn">Publish Post</button>
    </section>

    <h3>News Feed</h3>
    <div id="feed"></div>
    <button id="loadMoreBtn">Load More</button>
  </section>
</main>

<footer>
  <p>BanglaGram 🇧🇩 | Developed by Alpha.HR</p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
