<section id="createPage" class="page hidden">

  <div class="card create-post">

    <div class="create-header">
      <div class="avatar-small">🇧🇩</div>

      <div>
        <b>Create a post</b>
        <small>Share something with BanglaGram</small>
      </div>
    </div>

    <textarea
      id="postCaption"
      class="post-textarea"
      placeholder="What's happening? 🇧🇩"
      maxlength="500"
    ></textarea>

    <div class="char-count">
      <span id="charCount">0</span>/500
    </div>

    <button
      class="primary"
      onclick="createPost()"
    >
      🚀 Post
    </button>

  </div>

</section>
